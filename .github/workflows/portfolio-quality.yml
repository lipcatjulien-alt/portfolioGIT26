name: Portfolio quality and public PDF audit

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"
      - name: Audit HTML, linked assets and public PDF text
        run: python tests/audit_portfolio.py
      - name: Publish static results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-audit
          path: audit-results.json
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve portfolio and exercise interactive pages
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node tests/browser-smoke.cjs
      - name: Publish screenshots and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-audit
          path: |
            screenshot-*.png
            browser-results.json
          if-no-files-found: ignore
