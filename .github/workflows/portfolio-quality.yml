name: Portfolio quality and public PDF audit

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<2"
      - name: Audit HTML, linked assets and public PDF text
        run: python tests/audit_portfolio.py
      - name: Publish static results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-audit
          path: audit-results.json
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve portfolio and exercise interactive pages
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node tests/browser-smoke.cjs
      - name: Publish screenshots and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-audit
          path: |
            screenshot-*.png
            browser-results.json
          if-no-files-found: ignore

  live-http:
    runs-on: ubuntu-24.04
    steps:
      - name: Check public GitHub Pages response and security headers
        run: |
          python3 - <<'PY'
          import urllib.request, json
          url = "https://lipcatjulien-alt.github.io/portfolioGIT26/"
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"Portfolio-Audit/1.0"}), timeout=25) as resp:
              h = resp.headers
              keys = ["content-type","strict-transport-security","content-security-policy","x-frame-options","x-content-type-options","referrer-policy","permissions-policy","cache-control"]
              result = {"http_status":resp.status,"url":resp.url,"headers":{k:h.get(k) for k in keys}}
              print(json.dumps(result,ensure_ascii=False,indent=2))
              if resp.status != 200: raise SystemExit("unexpected HTTP status")
          PY
